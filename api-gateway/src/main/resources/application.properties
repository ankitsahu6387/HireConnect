# Application Name
spring.application.name=api-gateway

server.port=${PORT:8080}

# Eureka Config
eureka.client.service-url.defaultZone=${EUREKA_URL:https://hireconnect-eureka-service.onrender.com/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=10

# Gateway Routes

# AUTH SERVICE
spring.cloud.gateway.routes[4].id=auth-service
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/**,/oauth2/**,/login/oauth2/**

# USER SERVICE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

# JOB SERVICE
spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=lb://job-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**

# INTERVIEW SERVICE
spring.cloud.gateway.routes[2].id=interview-service
spring.cloud.gateway.routes[2].uri=lb://interview-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/interviews/**

# ANALYTICS SERVICE
spring.cloud.gateway.routes[3].id=analytics-service
spring.cloud.gateway.routes[3].uri=lb://analytics-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/analytics/**

# APPLICATION SERVICE
spring.cloud.gateway.routes[5].id=application-service
spring.cloud.gateway.routes[5].uri=lb://application-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/applications/**

# NOTIFICATION SERVICE
spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://notification-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/notify/**

# SUBSCRIPTION SERVICE
spring.cloud.gateway.routes[7].id=subscription-service
spring.cloud.gateway.routes[7].uri=lb://subscription-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/subscription/**,/payment/**

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
