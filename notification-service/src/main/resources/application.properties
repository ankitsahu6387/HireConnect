app.rabbitmq.exchange=hireconnect.notifications.exchange
app.rabbitmq.notification-queue=hireconnect.notifications.queue
app.rabbitmq.notification-routing-key=notification.send
app.rabbitmq.dead-letter-queue=hireconnect.notifications.dlq
app.rabbitmq.dead-letter-routing-key=notification.dead
