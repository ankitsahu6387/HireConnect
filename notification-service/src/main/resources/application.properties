spring.application.name=notification-service

server.port=${PORT:8086}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ankits6387@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:ankits6387@gmail.com}
spring.mail.password=${MAIL_PASSWORD:finsopufebekmarc}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
